    <h1 class="text-center text-white p-3" style="background-color: rgb(28, 67, 112)">
        2nd todo crud using fetch, async/await with checkbox and
        details
    </h1>

    <div class="container-fluid">
        <div class="row mt-5">
            <div class="col-md-4 offset-md-1 mb-4">
                <div class="card">
                    <div class="card-header text-white text-center" style="background-color: rgb(28, 67, 112)">
                        <h3>Add Your Todos</h3>
                    </div>

                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="todoInput">Todo Item</label>
                                <input required type="text" id="todoInput" class="form-control" />
                            </div>
                            <div class="form-group">
                                <label for="description">Todo Details</label>
                                <textarea required id="description" class="form-control" rows="4"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="status">Completed?</label>
                                <select class="form-control" id="status">
                                    <option value="no">No</option>
                                    <option value="yes">Yes</option>
                                </select>
                            </div>

                            <button class="btn btn-sm btn-block btn-outline-info" id="addTodoBtn">
                                Add Todo
                            </button>
                            <button type="button" class="btn btn-sm btn-block btn-outline-info d-none"
                                id="updateTodoBtn">
                                Update Todo
                            </button>
                            <button type="button" class="btn btn-sm btn-block btn-outline-danger"
                                id="cancelTodoBtn">
                                Cancel
                            </button>
                        </form>
                    </div>
                </div>
            </div>
